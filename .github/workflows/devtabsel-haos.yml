# devTabSel fork only. Never cherry-pick into a PR for martinhoefling/SpectrumKNX.
name: devTabSel HAOS branding

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  assert-branding:
    if: github.repository_owner == 'devTabSel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Assert devTabSel HAOS packaging overlay
        run: python scripts/devtabsel_haos_branding.py assert
